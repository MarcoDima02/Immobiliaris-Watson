
services:
  # ============================================
  # Database MySQL (Dev)
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: residea-mysql-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: residea_db
      MYSQL_USER: residea_user
      MYSQL_PASSWORD: ResideaP@ss
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - residea-network

  # ============================================
  # Backend Spring Boot (Dev - Hot Reload)
  # ============================================
  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: residea-backend-dev
    working_dir: /app
    volumes:
      - ./back-end/residea:/app
      - ~/.m2:/root/.m2 # Maven dependencies cache

      
    # Run the application directly with Maven
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "8080:8080"
      - "5005:5005" # Remote debug port
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/residea_db
      - SPRING_DATASOURCE_USERNAME=residea_user
      - SPRING_DATASOURCE_PASSWORD=ResideaP@ss

      # Mail configuration will be taken from the project .env so dev compose uses same SMTP settings
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - MAIL_DEFAULT_FROM=${MAIL_DEFAULT_FROM}
      - MAIL_REAL_ENABLED=${MAIL_REAL_ENABLED}
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    depends_on:
      - mysql
    networks:
      - residea-network

  # ============================================
  # Frontend React (Dev - HMR)
  # ============================================
  frontend:
    image: node:20-alpine
    container_name: residea-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid overwriting container's node_modules
      
    # MODIFY HERE: Install dependencies before starting
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - residea-network

  # ============================================
  # MailHog (SMTP capture for dev)
  # Web UI: http://localhost:8025
  # SMTP: localhost:1025
  # ============================================
  mailhog:
    image: mailhog/mailhog
    container_name: residea-mailhog-dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - residea-network

volumes:
  mysql_data_dev:

networks:
  residea-network:
    driver: bridge
