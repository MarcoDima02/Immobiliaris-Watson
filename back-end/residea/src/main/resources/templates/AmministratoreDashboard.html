<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Amministratore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Dashboard Amministratore</h1>

        <!-- Box con statistiche -->
        <div class="row mb-4">
            <div class="col-md-2">
                <a th:href="@{/dashboard-utenti}" style="text-decoration: none;">
                    <div class="card text-center bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Utenti</h5>
                            <p class="card-text" th:text="${numeroUtenti}">0</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-2">
                <a th:href="@{/dashboard-immobili}" style="text-decoration: none;">
                <div class="card text-center bg-success text-white">
                    <div class="card-body">
                        <h5 class="card-title">Immobili</h5>
                        <p class="card-text" th:text="${numeroImmobili}">0</p>
                    </div>
                </div>
                </a>
            </div>
            <div class="col-md-2">
                <a th:href="@{/dashboard-contratti}" style="text-decoration: none;">
                    <div class="card text-center bg-warning text-white">
                        <div class="card-body">
                            <h5 class="card-title">Contratti</h5>
                            <p class="card-text" th:text="${numeroContratti}">0</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-2">
                <a th:href="@{/dashboard-leads}" style="text-decoration: none;">
                <div class="card text-center bg-info text-white">
                    <div class="card-body">
                        <h5 class="card-title">Lead</h5>
                        <p class="card-text" th:text="${numeroLead}">0</p>
                    </div>
                </div>
                </a>
            </div>
<div class="col-md-2">
    <a th:href="@{/dashboard-richieste}" style="text-decoration: none;">
        <div class="card text-center bg-info text-white">
            <div class="card-body">
                <h5 class="card-title">Richieste</h5>
                <p class="card-text" th:text="${numeroRichieste}">0</p>
            </div>
        </div>
    </a>
</div>

            <div class="col-md-2">
                <a th:href="@{/dashboard-vendite}" style="text-decoration: none;">
                        
                    <div class="card text-center bg-dark text-white">
                        <div class="card-body">
                            <h5 class="card-title">Vendite</h5>
                            <p class="card-text" th:text="${totaleVendite}">0</p>
                        </div>
                    </div>
                
            </div>
            </a>
        </div>

        <!-- Tabella utenti -->
        <h2 class="mb-3">Lista Utenti</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Telefono</th>
                    <th>Email</th>
                    <th>Ruolo</th>
                </tr>
            </thead>
            <tbody>
            <tr th:each="utente : ${listaUtenti}">
                <td th:text="${utente.idUtente}">1</td>
                <td th:text="${utente.nome}">Nome</td>
                <td th:text="${utente.cognome}">Cognome</td>
                <td th:text="${utente.telefono}">0000000000</td>
                <td th:text="${utente.email}">email@example.com</td>
                <td th:text="${utente.ruolo}">Ruolo</td>
            </tr>

            </tbody>
        </table>
    </div>
</body>
</html>
