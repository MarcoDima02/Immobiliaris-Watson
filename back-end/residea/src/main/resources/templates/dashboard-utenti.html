<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestione Utenti</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Header */
        header {
            background: #2563eb;
            padding: 18px 32px;
            color: white;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* Page Content */
        .container {
            padding: 24px 40px;
        }

        /* Card box */
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-top: 0;
            font-size: 20px;
            color: #1f2937;
        }

        /* Inputs */
        input, select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            width: 100%;
            transition: border 0.2s;
            font-size: 15px;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .form-row > * {
            flex: 1 1 240px;
        }

        /* Buttons */
        button {
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        button:hover {
            background: #1e4fc3;
        }

        button.secondary {
            background: #6b7280;
        }
        button.secondary:hover {
            background: #4b5563;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        thead {
            background: #2563eb;
            color: white;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 15px;
        }

        tr:nth-child(even) {
            background: #f9fafb;
        }

        tr:hover {
            background: #e8f0fe;
            cursor: pointer;
        }

        tr._highlight {
            background-color: #d1fae5 !important;
        }

        /* Search section */
        .search-box {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

    </style>
</head>
<body>

<header>
    Gestione Utenti
</header>

<div class="container">

    <!-- FORM CARD -->
    <div class="card">
        <h3>➕ Crea / Aggiorna Utente</h3>

        <div class="form-row">
            <input id="idUtente" placeholder="ID (auto)" readonly>
            <input id="nome" placeholder="Nome">
            <input id="cognome" placeholder="Cognome">
        </div>

        <div class="form-row">
            <input id="email" placeholder="Email">
            <input id="telefono" placeholder="Telefono">
            <select id="ruolo">
                <option value="AMMINISTRATORE">Amministratore</option>
                <option value="USER">Utente</option>
            </select>
        </div>

        <button onclick="creaUtente()"><i class="fa fa-plus"></i> Crea</button>
        <button onclick="aggiornaUtente()"><i class="fa fa-save"></i> Aggiorna</button>
        <button onclick="resetForm()" class="secondary"><i class="fa fa-eraser"></i> Pulisci</button>
    </div>


    <!-- TABLE CARD -->
    <div class="card">
        <h3>📋 Elenco Utenti</h3>
        <table id="tabUtenti">
            <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Email</th>
                <th>Telefono</th>
                <th>Ruolo</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- SEARCH -->
    <div class="card">
        <h3>🔍 Ricerca Utente</h3>

        <div class="search-box">
            <input id="utenteSearchId" placeholder="Cerca per ID utente">
            <button onclick="cercaUtentePerId()"><i class="fa fa-search"></i> Cerca</button>
            <button onclick="mostraTuttiUtenti()" class="secondary"><i class="fa fa-list"></i> Mostra tutti</button>
        </div>
    </div>

</div>

<!-- SCRIPT (identico al tuo, NON modificato tranne estetica) -->
<script>
const api = "/api/utenti";

async function creaUtente(){
    const payload = buildPayloadFromForm();
    delete payload.idUtente;
    const res = await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok){ alert("Errore creazione"); return; }
    alert("Utente creato!"); getAllUtenti(); resetForm();
}

async function aggiornaUtente(){
    const payload = buildPayloadFromForm();
    if(!payload.idUtente){ alert("Inserisci ID"); return; }
    const res = await fetch(api,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok){ alert("Errore aggiornamento"); return; }
    alert("Aggiornato!"); getAllUtenti(); resetForm();
}

function buildPayloadFromForm(){
    const p={};
    const id=document.getElementById('idUtente').value.trim();
    if(id) p.idUtente=Number(id);
    p.nome=document.getElementById('nome').value.trim();
    p.cognome=document.getElementById('cognome').value.trim();
    p.email=document.getElementById('email').value.trim();
    p.telefono=document.getElementById('telefono').value.trim();
    p.ruolo=document.getElementById('ruolo').value;
    return p;
}

async function getAllUtenti(){
    const res = await fetch(api);
    const utenti = await res.json();
    renderTable(utenti);
}

function renderTable(utenti){
    const tbody=document.querySelector('#tabUtenti tbody');
    tbody.innerHTML='';
    utenti.forEach(u=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`
            <td>${u.idUtente}</td>
            <td>${u.nome}</td>
            <td>${u.cognome}</td>
            <td>${u.email}</td>
            <td>${u.telefono}</td>
            <td>${u.ruolo}</td>
        `;
        tr.addEventListener("click",()=>{ loadUtenteIntoForm(u); highlightRowById(u.idUtente); });
        tbody.appendChild(tr);
    });
}

function loadUtenteIntoForm(u){
    document.getElementById('idUtente').value=u.idUtente;
    document.getElementById('nome').value=u.nome;
    document.getElementById('cognome').value=u.cognome;
    document.getElementById('email').value=u.email;
    document.getElementById('telefono').value=u.telefono;
    document.getElementById('ruolo').value=u.ruolo;
}

function highlightRowById(id){
    const rows=document.querySelectorAll('#tabUtenti tbody tr');
    rows.forEach(r=>r.classList.remove("_highlight"));
    rows.forEach(r=>{
        if(r.children[0].textContent==id){
            r.classList.add("_highlight");
            r.scrollIntoView({behavior:'smooth',block:'center'});
        }
    });
}

function resetForm(){
    ['idUtente','nome','cognome','email','telefono'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('ruolo').value="USER";
}

async function cercaUtentePerId(){
    const id=document.getElementById('utenteSearchId').value.trim();
    if(!id){ alert("Inserisci ID"); return; }
    const res=await fetch(api);
    const utenti=await res.json();
    const f=utenti.find(u=>String(u.idUtente)===id);
    if(!f){ alert("Utente non trovato"); return; }
    loadUtenteIntoForm(f);
    highlightRowById(f.idUtente);
}

function mostraTuttiUtenti(){ document.getElementById('utenteSearchId').value=''; resetForm(); getAllUtenti(); }

getAllUtenti(); // load initial
</script>

</body>
</html>
